# UniFi dynamic inventory. Name files *.unifi.yml or *.unifi.yaml for discovery.
plugin: aioue.network.unifi

# Base URL of the controller (e.g. UDM, UCG).
url: https://unifi.example.net

# Supply UNIFI_USERNAME and UNIFI_PASSWORD through the environment or Vault.
# A local account avoids ui.com SSO dependencies; TOTP accounts also require
# UNIFI_TOTP_SECRET (the Base32 authenticator setup seed).
# UNIFI_TOKEN accepts an existing, expiring UniFi OS TOKEN session cookie.
# Network API integration keys are unsupported.

# Most single-controller setups use the default site.
site: default

# Trust the controller CA; disabling verification accepts unverified TLS.
validate_certs: true

# Adds access points, switches, and gateways when enabled.
include_devices: false

# Excludes stale/disconnected clients beyond this threshold (minutes).
last_seen_minutes: 30

# MAC-based hostnames stay stable when friendly device names change.
# hostname: mac

# Duplicate names get MAC suffixes with warnings; fail stops loading instead.
# hostname_collision: fail

# Malformed records fail by default; false skips them with warnings.
# strict_records: true

# False excludes clients that only have last-known or reserved addresses.
# allow_historical_addresses: false

# Standard Ansible inventory caching reduces repeated controller logins.
# cache: true
# cache_plugin: ansible.builtin.jsonfile
# cache_connection: .cache/unifi_inventory
# cache_timeout: 30

