name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install declared dependencies
        run: bash .github/scripts/install-ci-dependencies.sh "${{ matrix.dependencies }}"
      - name: Ruff lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run source tests
        run: pytest tests/unit tests/integration -q
      - name: Build and test installed collection
        run: |
          mkdir -p dist
          ansible-galaxy collection build --output-path dist/
          bash .github/scripts/test-artifact.sh dist/*.tar.gz
      - name: Prepare collection tree for ansible-test
        run: |
          bash .github/scripts/prepare-collection-tree.sh
          echo "SANITY_TREE=$(cat .sanity-tree-path)" >> "$GITHUB_ENV"
      - name: Run ansible-test sanity
        working-directory: ${{ env.SANITY_TREE }}/ansible_collections/aioue/network
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ env.SANITY_TREE }}
        run: ansible-test sanity --local --python 3.14 --color no
  # Keep the existing branch-protection check name while testing both resolutions.
  test:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
