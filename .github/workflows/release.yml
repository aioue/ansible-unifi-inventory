name: Release to Ansible Galaxy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Creates the GitHub release and attaches the tested archive.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate version and release notes before publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH"
            exit 1
          fi
          actual="$(awk '/^version: / { print $2; exit }' galaxy.yml)"
          if [ "$actual" != "$version" ]; then
            echo "::error::galaxy.yml version ($actual) does not match tag $RELEASE_TAG"
            exit 1
          fi
          bash .github/scripts/extract-changelog.sh "$version" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install declared dependencies
        run: bash .github/scripts/install-ci-dependencies.sh minimum
      - name: Ruff lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run source tests
        run: pytest tests/unit tests/integration -q
      - name: Prepare collection tree for ansible-test
        run: |
          bash .github/scripts/prepare-collection-tree.sh
          echo "SANITY_TREE=$(cat .sanity-tree-path)" >> "$GITHUB_ENV"
      - name: Run ansible-test sanity
        working-directory: ${{ env.SANITY_TREE }}/ansible_collections/aioue/network
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ env.SANITY_TREE }}
        run: ansible-test sanity --local --python 3.14 --color no
      - name: Build once and test the release archive
        run: |
          mkdir -p dist
          ansible-galaxy collection build --output-path dist/
          bash .github/scripts/test-artifact.sh dist/*.tar.gz
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish tested archive to Ansible Galaxy
        env:
          GALAXY_API_TOKEN: ${{ secrets.GALAXY_API_TOKEN }}
        run: ansible-galaxy collection publish dist/*.tar.gz --token "$GALAXY_API_TOKEN"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
