# pull_request_target only reads metadata and queues a merge; it never runs PR code.
# Every Dependabot PR, including major bumps, is queued for auto-merge and lands
# once the required "test" check passes. A bump that breaks CI never merges.
name: Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  dependabot:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge after required checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
