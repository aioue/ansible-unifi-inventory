# pull_request_target only reads metadata and queues a merge; it never runs PR code.
# Integer aiounifi releases, grouped updates, and unknown version schemes need review.
name: Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  dependabot:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Decide auto-merge eligibility
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          DEPENDENCY_GROUP: ${{ steps.meta.outputs.dependency-group }}
        run: |
          eligible=false
          # A patch classification is only useful for these known semver dependencies.
          if [ "$UPDATE_TYPE" = "version-update:semver-patch" ] && [ -z "$DEPENDENCY_GROUP" ]; then
            case "$DEP_NAMES" in
              aiohttp|PyYAML|pyotp|pytest|ruff|ansible-core) eligible=true ;;
            esac
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          printf 'Auto-merge eligible: %s\n' "$eligible" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable auto-merge after required checks pass
        if: steps.decide.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
