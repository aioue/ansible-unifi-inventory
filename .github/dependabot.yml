# aiounifi uses integer releases. Those are not semver-minor or semver-patch,
# so auto-merge leaves them for review. Minor and patch updates, including
# grouped CodeQL action bumps, merge after CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    allow:
      - dependency-type: direct
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: pip
    directory: /tests/unit
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: chore
      include: scope
